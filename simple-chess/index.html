<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Chess</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1 class="title">Simple Chess</h1>

    <section class="layout">
      <div class="board-shell">
        <!-- Rank labels (8 to 1) -->
        <div id="rank-labels" class="rank-labels" aria-hidden="true"></div>

        <!-- Chessboard rendered from JavaScript state -->
        <div id="board" class="board" aria-label="Chessboard"></div>

        <!-- File labels (a to h) -->
        <div id="file-labels" class="file-labels" aria-hidden="true"></div>
      </div>

      <aside class="panel">
        <h2>Game Status</h2>
        <p id="status">Turn: White</p>
        <button id="reset-btn" type="button">Reset Game</button>
      </aside>
    </section>
  </main>

  <!-- jQuery from CDN (properly included, no backend needed) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
